# https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions
---
# shown in badge
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/configuring-a-workflow#adding-a-workflow-status-badge-to-your-repository
name: tests

on:
  push:
  pull_request:
  schedule:
  - cron: '0 20 * * 5'

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-24.04
        # macos-26 jobs did not get a runner in 2026-11
        # (stayed queued until cancelled)
        - macos-15
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # with pipenv v2023.6.26:
    # > $ pipenv run pytest --cov="$(cat *.egg-info/top_level.txt)"
    # . --cov-report=term-missing --cov-fail-under=100
    # > cat: '*.egg-info/top_level.txt': No such file or directory
    # > [...]
    # > [...]/coverage/inorout.py:507: CoverageWarning:
    # . Module  was never imported. (module-not-imported)
    # pipenv v2023.6.18 imports distutils on macOS, which python3.12 removed
    # version as in
    # https://github.com/fphammerle/free-disk/blob/f8850ec14eb721141085510bf96d527c73b5cb34/.github/workflows/python.yml
    - run: pip install --upgrade pipenv==2025.1.3
    # by default pipenv picks the latest version in PATH
    - run: pipenv install --python "$PYTHON_VERSION" --deploy --dev
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
    - run: pipenv graph
    - if: runner.os == 'macOS'
      run: pipenv run pytest
    - if: runner.os == 'Linux'
      run: >-
        pipenv run pytest --cov="$(cat *.egg-info/top_level.txt)"
        --cov-report=term-missing --cov-fail-under=100
    - run: pipenv run pylint "$(cat *.egg-info/top_level.txt)" tests/*
  install:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.13'}
    # https://github.com/pypa/build builds in an isolated env
    # with the build requirements from pyproject.toml
    - run: pip install build==1.6.1
    - run: python -m build --wheel
    # separate env, outside of the source dir,
    # so the import can't pick up ./dlinfo
    - run: python -m venv /tmp/install-env
    - run: '! /tmp/install-env/bin/python -c "import dlinfo"'
      working-directory: /tmp
    - run: /tmp/install-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
    - run: >-
        /tmp/install-env/bin/python -c
        'import ctypes, ctypes.util, dlinfo;
        print(dlinfo.DLInfo(ctypes.CDLL(ctypes.util.find_library("c"))).path)'
      working-directory: /tmp
